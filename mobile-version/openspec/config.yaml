schema: spec-driven

context: |
  Project: mobile-version
  Runtime: Godot 4 mobile project using GDScript.
  Target: mobile-first game/application experience.
  Conventions:
    - Keep implementation scoped to this mobile-version directory.
    - Use Godot scenes under res://scenes and GDScript under res://scripts.
    - Prefer small, focused OpenSpec changes before implementation.
    - Specs describe observable behavior; design docs capture Godot architecture decisions only when needed.

